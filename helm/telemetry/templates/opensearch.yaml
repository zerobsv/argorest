apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: opensearch
          image: {{ .Values.opensearch.image | quote }}
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_SINGLE_NODE
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms512m -Xmx512m
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              value: "admin"
            - name: OPENSEARCH_SECURITY_ENABLED
              value: "false"
            - name: OPENSEARCH_PERSISTENCE_ENABLED
              value: "{{ .Values.opensearch.persistence.enabled }}"
            - name: OPENSEARCH_PERSISTENCE_SIZE
              value: "{{ .Values.opensearch.persistence.size }}"
          ports:
            - name: http
              containerPort: 9200
          resources:
{{ toYaml .Values.opensearch.resources | indent 12 }}
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
spec:
  selector:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.opensearch.service.port }}
      targetPort: http
