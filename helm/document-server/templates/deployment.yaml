apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: document-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsUser: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: initialize-data
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /app/data
              touch /app/data/documents.db
              chmod -R 750 /app/data
              chown -R 10001:10001 /app/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: {{ .Values.volume.name }}
              mountPath: /app/data
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_PATH
              value: /app/data/documents.db
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://localhost:4317
          volumeMounts:
            - name: {{ .Values.volume.name }}
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: otel-collector
          image: {{ .Values.collector.image | quote }}
          args:
            - --config=/etc/otelcol-contrib/otel-collector-config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8889
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: {{ .Values.volume.name }}
          persistentVolumeClaim:
            claimName: document-server-data
        - name: otel-collector-config
          configMap:
            name: {{ .Values.collector.configMapName }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: document-server-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: document-server
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: document-server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: document-server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: 8889
      targetPort: metrics
